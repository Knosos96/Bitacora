<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bitácora TI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <div id="app">
    <section id="vista-login" class="login-screen hidden">
      <div class="login-card">
        <p class="brand">Bitácora TI</p>
        <h1>Entrar</h1>
        <p class="muted">Misma API que el escritorio. Usa tu correo y clave.</p>
        <form id="form-login">
          <label>Correo<input name="correo" type="email" autocomplete="username" required /></label>
          <label>Clave<input name="clave" type="password" autocomplete="current-password" required /></label>
          <button type="submit" class="btn primary">Entrar</button>
          <p id="login-error" class="error" hidden></p>
        </form>
      </div>
    </section>

    <div id="vista-app" class="app-shell hidden">
      <header class="topbar">
        <div class="brand-block">
          <span class="brand">Bitácora TI</span>
          <span id="user-chip" class="chip"></span>
        </div>
        <nav class="nav">
          <a href="#/" data-nav>Hoy</a>
          <a href="#/pendientes" data-nav>Pendientes</a>
          <a href="#/busqueda" data-nav>Búsqueda</a>
          <a href="#/tablero" data-nav class="solo-gestor hidden">Tablero</a>
          <a href="#/admin" data-nav class="solo-gestor hidden">Administración</a>
        </nav>
        <button type="button" id="btn-salir" class="btn ghost">Salir</button>
      </header>
      <p id="aviso-vencidos" class="aviso hidden"></p>
      <main id="contenido" class="contenido"></main>
    </div>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-panel" id="modal-panel"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
